[package]
name = "native-usage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"  
clap = { version = "4", features = ["derive"] }  
tokio = { version = "1", features = ["full"] }  
futures = "0.3"  
serde = { version = "1", features = ["derive"] }  
serde_json = "1"  
walkdir = "2"  
indicatif = "0.17"  
  
sui-sdk = { git = "https://github.com/MystenLabs/sui.git", tag = "mainnet-v1.79.1", package = "sui-sdk" }  
sui-json-rpc-types = { git = "https://github.com/MystenLabs/sui.git", tag = "mainnet-v1.79.1", package = "sui-json-rpc-types" }  
move-trace-format = { git = "https://github.com/MystenLabs/sui.git", tag = "mainnet-v1.79.1", package = "move-trace-format" }
